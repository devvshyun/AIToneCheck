<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI 톤 체크</title>
  <meta name="description" content="한국어 글에서 AI가 쓴 것처럼 읽히는 부분을 찾아 표시하고 고칠 방향을 알려 주는 브라우저 전용 도구">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
  <link rel="stylesheet" href="fonts/pretendard/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 검사 스크립트가 실행되지 못하면(구형 브라우저, 파일 로드 실패) 안내를 띄운다
    window.__bootErrors = [];
    addEventListener("error", function (e) {
      var t = e.target;
      if (t && t !== window && t.tagName) {
        if (t.tagName === "SCRIPT") window.__bootErrors.push("파일을 불러오지 못함: " + t.src);
        return; // 글꼴·이미지 실패는 무시
      }
      window.__bootErrors.push(e.message || "알 수 없는 오류");
    }, true);
    addEventListener("load", function () {
      setTimeout(function () {
        if (window.__appReady) return;
        var box = document.getElementById("boot-error");
        if (!box) return;
        box.hidden = false;
        if (window.__bootErrors.length) document.getElementById("boot-detail").textContent = window.__bootErrors[0];
      }, 1200);
    });
  </script>
</head>
<body>
  <div class="boot-error" id="boot-error" role="alert" hidden>
    <b>이 브라우저에서는 검사 기능이 실행되지 않았습니다.</b> 최신 Chrome, Edge, Firefox, Safari(iOS·macOS 16.4 이상)에서 다시 열어 주세요.
    <span id="boot-detail"></span>
  </div>

  <header class="top">
    <a class="logo" href="./">AI 톤 체크</a>
    <div class="tools">
      <label class="tbtn file-btn" title="TXT, MD, HTML, RTF, DOCX, ODT, HWP, HWPX, PDF, EPUB, PPTX">
        <input type="file" id="file">
        <span>파일 열기</span>
      </label>
      <details class="menu" id="sample-menu">
        <summary class="tbtn">예문</summary>
        <div class="menu-list" id="samples"></div>
      </details>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="tools end">
      <span class="count" id="count"></span>
      <button class="tbtn" id="compare-btn" type="button" hidden>처음 글과 비교</button>
      <button class="tbtn" id="copy" type="button">복사</button>
      <button class="tbtn" id="clear" type="button">비우기</button>
      <a class="tbtn ghost" href="https://github.com/devvshyun/AIToneCheck" title="소스 코드">GitHub</a>
    </div>
  </header>

  <main class="app">
    <section class="editor" aria-label="검사할 글">
      <div class="scroller" id="scroller">
        <div class="doc" id="doc">
          <div class="backdrop" id="backdrop" aria-hidden="true"></div>
          <textarea id="src" spellcheck="false" aria-label="검사할 글" placeholder="검사할 글을 붙여 넣거나 파일을 끌어다 놓으세요."></textarea>
        </div>
        <div class="diffview" id="diffview" hidden></div>
      </div>
      <div class="empty" id="empty">
        <p>글을 넣으면 바로 검사합니다. 소설인지 에세이인지 설명문인지는 글을 보고 판단합니다.</p>
        <p class="muted">파일: TXT · MD · HTML · RTF · DOCX · ODT · HWP · HWPX · PDF · EPUB · PPTX</p>
        <div class="empty-samples" id="empty-samples"></div>
      </div>
      <div class="drop" id="drop" aria-hidden="true"><span>여기에 놓으면 글을 꺼내 옵니다</span></div>
    </section>

    <aside class="panel" id="panel" aria-label="검사 결과">
      <button class="handle" id="handle" type="button" aria-expanded="false">
        <span class="handle-bar" aria-hidden="true"></span>
        <span class="handle-text" id="handle-text">글을 넣으면 결과가 여기에 나옵니다</span>
      </button>
      <nav class="tabs" role="tablist">
        <button role="tab" type="button" data-tab="summary" aria-selected="true">요약</button>
        <button role="tab" type="button" data-tab="items" aria-selected="false">항목 <span id="items-count"></span></button>
        <button role="tab" type="button" data-tab="changes" aria-selected="false">변화 <span id="changes-dot"></span></button>
        <button role="tab" type="button" data-tab="more" aria-selected="false">더 보기</button>
      </nav>
      <div class="panel-body" id="panel-body">
        <div class="tab" id="tab-summary" role="tabpanel"></div>
        <div class="tab" id="tab-items" role="tabpanel" hidden></div>
        <div class="tab" id="tab-changes" role="tabpanel" hidden></div>
        <div class="tab" id="tab-more" role="tabpanel" hidden></div>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
